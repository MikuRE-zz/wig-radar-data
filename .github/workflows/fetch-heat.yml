name: Fetch catalog and heat

on:
  schedule:
    - cron: "20 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-heat
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update catalog
        run: python scripts/fetch_catalog.py --out catalog.json --hair-limit 40

      - name: Scrape heat
        run: python scripts/fetch_heat.py --out heat.json --no-write-assets

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json heat.json
          if git diff --staged --quiet; then
            echo "No catalog or heat changes"
          else
            git commit -m "chore: refresh catalog and heat"
            git push
          fi
